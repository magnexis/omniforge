name: Omniforge

on:
  push:
  pull_request:

jobs:
  omniforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: List workers
        run: python omniforge.py workers
      - name: Run tests
        run: python -m unittest tests/test_omniforge.py
